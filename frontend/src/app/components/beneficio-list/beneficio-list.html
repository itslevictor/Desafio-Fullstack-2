<div class="dashboard-container">
  <h2>Seu Histórico de Transações</h2>
  
  <table class="transaction-table">
    <thead>
      <tr>
        <th>Data</th>
        <th>Tipo</th>
        <th>Descrição</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of transacoes">
        <td>{{ t.data | date:'dd/MM/yyyy' }}</td>
        <td>{{ t.tipo }}</td>
        <td>{{ t.descricao }}</td>
        <td [ngClass]="{'valor-negativo': t.valor < 0}">{{ t.valor | currency:'BRL' }}</td>
      </tr>
    </tbody>
  </table>

  <div class="dashboard-actions">
    <button class="btn-main" routerLink="/transferencia">Efetuar Nova Transferência</button>
    <a routerLink="/extrato-completo" class="link-extrato">Ver Extrato Completo</a>
  </div>
</div>
