<div class="bank-container">
  <div class="feedback-toast" *ngIf="feedbackStatus" [class]="feedbackStatus">
    {{ feedbackMsg }}
  </div>

  <header class="bank-header" *ngIf="logado">
    <div class="logo">BIP <span>Digital</span></div>
    <div class="user-info">
      <span>Olá, <strong>{{ contaAtiva?.nome }}</strong></span>
      <button class="btn-sair-pilula" (click)="logout()">Sair</button>
    </div>
  </header>

  <main class="bank-content">
    <section class="login-wrapper" *ngIf="!logado">
      <div class="login-card">
        <h2>Acessar BIP</h2>
        <div class="form-group">
          <input type="text" [(ngModel)]="loginInput" placeholder="Usuário (admin)">
          <input type="password" [(ngModel)]="senhaInput" placeholder="Senha (admin)">
          <button (click)="login()" class="btn-primary">Entrar</button>
        </div>
      </div>
    </section>

    <section class="dashboard" *ngIf="logado">
      <nav class="bank-nav" style="margin-bottom: 2rem; display: flex; gap: 15px;">
        <button routerLink="/beneficios" class="btn-link">Resumo de Benefícios</button>
        <button routerLink="/transferir" class="btn-link">Nova Transferência</button>
      </nav>

      <router-outlet></router-outlet>
      
      <div style="margin-top: 1rem;">
        <button (click)="showModal = true" class="btn-link">Ver Extrato Completo</button>
      </div>
    </section>
  </main>

  <div class="full-modal" *ngIf="showModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Extrato Consolidado</h2>
        <div class="actions">
          <button (click)="exportarPDF()" class="btn-export">Imprimir PDF</button>
          <button (click)="showModal = false" class="btn-close">✕</button>
        </div>
      </div>
      <div class="modal-body">
        <table class="full-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Descrição</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let b of beneficios">
              <td>{{ b.id }}</td>
              <td>{{ b.nome }}</td>
              <td>{{ b.descricao }}</td>
              <td>{{ b.valor | currency:'BRL' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
